{% extends 'base.html' %}

{% block title %}{% if object %}تعديل مهمة{% else %}مهمة جديدة{% endif %} | Smart Offer{% endblock %}

{% block content %}
{# الصفحة الكاملة تُستخدم فقط إن فُتح الرابط مباشرة؛ الاستخدام المعتاد من المودال #}
<div class="card" id="taskFormModalContent">
    {% include 'tasks/_task_form.html' %}
</div>
<script>
(function () {
    var form = document.querySelector('form.task-form');
    form.querySelectorAll('[data-bs-dismiss=modal]').forEach(function (b) {
        b.addEventListener('click', function () { history.back(); });
    });
    var search = form.querySelector('.assignee-search');
    search.addEventListener('input', function () {
        var q = search.value.trim();
        form.querySelectorAll('.assignee-item').forEach(function (el) {
            el.style.display = !q || el.textContent.indexOf(q) !== -1 ? '' : 'none';
        });
    });
    var freq = form.querySelector('[name=frequency]');
    var weekly = form.querySelector('.weekly-count-wrap');
    function toggle() { weekly.style.display = freq.value === 'weekly' ? '' : 'none'; }
    freq.addEventListener('change', toggle);
    toggle();
})();
</script>
{% endblock %}
